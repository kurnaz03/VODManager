# Load Balancer Server Nginx Config
# Server: 138.201.196.89
# Serves HLS segments generated by FFmpeg for VOD channel playlists
# Install: copy to /etc/nginx/sites-available/lb-server on LB machine
#          ln -sf /etc/nginx/sites-available/lb-server /etc/nginx/sites-enabled/lb-server

server {
    listen 80;
    server_name _;

    location /hls/ {
        alias /var/www/vod-manager/shared/hls/;
        add_header Cache-Control no-cache;
        add_header Access-Control-Allow-Origin *;
        types {
            application/vnd.apple.mpegurl m3u8;
            video/mp2t ts;
        }
        autoindex off;
    }
}
